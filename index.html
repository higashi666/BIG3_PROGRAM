<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101e2b"><title>BIG3_PROGRAM</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#142335;background:#f3f6f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #62a9f7;outline-offset:2px}.hero{background:#101e2b;color:white;padding:26px max(20px,calc((100vw - 970px)/2)) 24px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#91b9d8;font-weight:800}.hero h1{font-size:clamp(24px,5vw,36px);margin:8px 0 9px;letter-spacing:-.03em}.hero p{font-size:13px;line-height:1.8;color:#c1d1df;margin:0}.wrap{max-width:970px;margin:0 auto;padding:20px 16px 56px}.panel{border:1px solid #e1e7ec;border-radius:16px;background:#fff;box-shadow:0 5px 20px #1b293a08;margin-bottom:17px;overflow:hidden}.inner{padding:18px}.section-title{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}.muted{color:#64788b;font-size:12px;line-height:1.65;margin:0}.max-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:15px}.max-box{border:1px solid #dce5ee;border-radius:12px;padding:12px;background:#f8fafc}.max-box label{font-size:11px;color:#52677d;font-weight:700;display:block;min-height:33px}.max-line{display:flex;gap:4px;align-items:baseline}.max-line input{border:0;background:transparent;font-size:24px;font-weight:850;max-width:100%;min-width:0;width:100%;color:#132638}.max-line span{font-size:12px;color:#6e8192}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d1dde8;color:#17304a;background:white;padding:9px 12px;border-radius:9px;font-size:12px;font-weight:750}.btn.primary{background:#1a5eab;border-color:#1a5eab;color:white}.btn{white-space:nowrap;overflow-wrap:normal;word-break:normal}.btn:hover{filter:brightness(.96)}.week-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px;background:white;border-bottom:1px solid #e5ebf0}.tab{border:1px solid #dce5ed;border-radius:10px;background:#f8fafc;padding:12px 4px;font-weight:800;color:#60768a;font-size:12px}.tab.on{background:#163e64;color:#fff;border-color:#163e64}.week-header{padding:18px 18px 5px;display:flex;align-items:center;justify-content:space-between;gap:12px}.week-header h2{margin:0;font-size:21px}.pill{background:#e7f2ff;color:#225d99;border-radius:50px;padding:6px 10px;font-size:11px;font-weight:800}.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 16px 18px}.day{border:1px solid #dbe5ee;border-radius:13px;overflow:hidden;background:white}.day-head{padding:13px 13px 12px;background:#f5f8fb;border-bottom:1px solid #e3eaf0;display:flex;align-items:center;justify-content:space-between;gap:8px}.day-head b{font-size:14px}.day-head small{color:#697f92;font-size:11px}.entries{padding:10px 12px 6px}.entry{padding:10px 0;border-bottom:1px solid #eff2f5}.entry:last-child{border-bottom:0}.entry-top{display:flex;gap:8px;align-items:center;justify-content:space-between}.exercise{font-size:13px;font-weight:800}.hint{font-size:11px;color:#647a8d;margin-top:3px}.weight-wrap{white-space:nowrap;display:flex;align-items:center;gap:3px}.weight-wrap input{font-size:16px;font-weight:850;text-align:right;width:65px;padding:5px 3px;border:1px solid #d2deea;border-radius:7px;background:#fff;color:#15344d}.weight-wrap span{font-size:11px;color:#687b89}.sets{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.set{position:relative;display:flex;align-items:center;gap:5px;font-size:11px;color:#536b80;border:1px solid #dce5ee;background:#f7fafc;border-radius:8px;padding:6px 8px;cursor:pointer;user-select:none}.set input{accent-color:#2b73b6;width:15px;height:15px;margin:0}.set:has(input:checked){background:#e3f3e9;border-color:#bce1ca;color:#246644}.notes-label{display:block;font-size:11px;font-weight:750;color:#526a7e;padding:0 12px 4px}.notes{display:block;width:calc(100% - 24px);margin:0 12px 12px;min-height:50px;border:1px solid #dde6ef;border-radius:9px;padding:9px;font-size:12px;resize:vertical}.fine{font-size:12px;color:#64798c;line-height:1.8}.fine strong{color:#243c54}.foot-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.small-head{font-weight:800;font-size:14px;margin:0 0 8px}.line{height:1px;background:#e8eef2;margin:15px 0}.summary{font-size:12px;color:#51697b;margin:0 18px 6px;line-height:1.8}.help{padding:13px 16px;margin-top:3px;background:#f8fafc;border-top:1px solid #e9edf1}.printmark{display:none}@media(max-width:680px){.max-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.max-box{padding:9px}.max-box label{font-size:10px;min-height:40px}.max-line input{font-size:21px}.days{grid-template-columns:1fr;gap:10px}.foot-grid{grid-template-columns:1fr}.toolbar{align-items:stretch}.actions{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.actions button{min-width:0;padding:11px 4px;font-size:clamp(10px,2.7vw,12px);white-space:nowrap}.hero{padding:23px 18px}.week-header h2{font-size:18px}}@media print{body{background:white!important}.hero{background:white;color:#15283a;border-bottom:2px solid #15283a;padding:12px 0 15px}.hero p,.eyebrow{color:#445e70}.wrap{max-width:none;padding:0}.panel{box-shadow:none;border:0;border-bottom:1px solid #aaa;border-radius:0;margin-bottom:10px}.max-grid{margin-top:7px}.max-box{padding:6px}.inner{padding:10px 0}.week-tabs,.toolbar,.help,.notes,.notes-label,.btn{display:none!important}.week-header{padding:8px 0}.days{padding:8px 0;gap:8px;grid-template-columns:1fr 1fr}.day{break-inside:avoid}.day-head{padding:8px}.entries{padding:4px 8px}.entry{padding:5px 0}.sets{margin-top:5px}.printmark{display:block;color:#667;font-size:10px}.foot-grid{grid-template-columns:1fr 1fr}.set{padding:3px 5px}.set input{appearance:none;border:1px solid #777;border-radius:2px;width:9px;height:9px}.set input:checked{background:#777}.max-line input{font-size:18px}}
</style></head>
<body>
<header class="hero"><h1>BIG3_PROGRAM</h1></header>
<main class="wrap">
<section class="panel"><div class="inner"><h2 class="section-title">1RM SETTINGS</h2>
<div class="max-grid"><div class="max-box"><label for="sq">Squat</label><div class="max-line"><input id="sq" type="number" min="1" max="400" step="2.5" value="100"><span>kg</span></div></div><div class="max-box"><label for="bp">Bench Press</label><div class="max-line"><input id="bp" type="number" min="1" max="400" step="2.5" value="75"><span>kg</span></div></div><div class="max-box"><label for="dl">Deadlift</label><div class="max-line"><input id="dl" type="number" min="1" max="400" step="2.5" value="100"><span>kg</span></div></div></div>
<div class="toolbar"><div class="actions"><button class="btn primary" id="csv">Export CSV</button><button class="btn" id="print">Save PDF</button><button class="btn" id="reset">Reset Checks</button></div></div></div></section>
<section class="panel"><div class="week-tabs" role="tablist" aria-label="Training Week"><button class="tab on" data-week="1">W1</button><button class="tab" data-week="2">W2</button><button class="tab" data-week="3">W3</button><button class="tab" data-week="4">W4</button></div><div class="week-header"><h2 id="weekTitle">W1</h2><span class="pill" id="progress">0 / 0 sets</span></div><div class="days" id="days"></div></section>
<p class="printmark">BIG3_PROGRAM</p>
</main>
<script>
'use strict';
const KEY='big3_pana_100_v1';let state={max:{sq:100,bp:75,dl:100},weights:{},done:{},notes:{},week:1};try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved)state={...state,...saved,max:{...state.max,...saved.max}}}catch(e){}
const names={sq:'Squat',bp:'Bench Press',dl:'Deadlift'};
function entry(id,lift,sets,reps,pct,name){return{id,lift,sets,reps,pct,name:name||names[lift]}}
const program={
1:[{title:'DAY 1',sub:'VOLUME',rows:[entry('sqv','sq',3,5,74),entry('bpv','bp',3,5,74)]},{title:'DAY 2',sub:'TECHNIQUE / VOLUME',rows:[entry('dlv','dl',3,5,74),entry('bpl','bp',3,7,60,'Bench Press (Light)')]},{title:'DAY 3',sub:'STRENGTH',rows:[entry('sqt','sq',2,3,84,'Squat (Top Set)'),entry('sqb','sq',2,3,77,'Squat (Back-off)'),entry('bpt','bp',2,3,85,'Bench Press (Top Set)'),entry('bpb','bp',2,3,77,'Bench Press (Back-off)')]},{title:'DAY 4',sub:'STRENGTH',rows:[entry('dlt','dl',2,3,85,'Deadlift (Top Set)'),entry('dlb','dl',2,3,77,'Deadlift (Back-off)')]}],
2:[{title:'DAY 1',sub:'VOLUME',rows:[entry('sqv','sq',3,5,78),entry('bpv','bp',3,5,78)]},{title:'DAY 2',sub:'TECHNIQUE / VOLUME',rows:[entry('dlv','dl',3,5,78),entry('bpl','bp',3,7,60,'Bench Press (Light)')]},{title:'DAY 3',sub:'STRENGTH',rows:[entry('sqt','sq',2,3,87,'Squat (Top Set)'),entry('sqb','sq',2,3,79,'Squat (Back-off)'),entry('bpt','bp',2,3,87,'Bench Press (Top Set)'),entry('bpb','bp',2,3,79,'Bench Press (Back-off)')]},{title:'DAY 4',sub:'STRENGTH',rows:[entry('dlt','dl',2,3,87,'Deadlift (Top Set)'),entry('dlb','dl',2,3,79,'Deadlift (Back-off)')]}],
3:[{title:'DAY 1',sub:'VOLUME',rows:[entry('sqtop5','sq',1,5,82),entry('sqv','sq',2,5,78),entry('bptop5','bp',1,5,82),entry('bpv','bp',2,5,78)]},{title:'DAY 2',sub:'TECHNIQUE / VOLUME',rows:[entry('dltop5','dl',1,5,82),entry('dlv','dl',2,5,78),entry('bpl','bp',3,7,60,'Bench Press (Light)')]},{title:'DAY 3',sub:'STRENGTH',rows:[entry('sqt','sq',2,3,89,'Squat (Top Set)'),entry('sqb','sq',2,3,81,'Squat (Back-off)'),entry('bpt','bp',2,3,89,'Bench Press (Top Set)'),entry('bpb','bp',2,3,81,'Bench Press (Back-off)')]},{title:'DAY 4',sub:'STRENGTH',rows:[entry('dlt','dl',2,3,89,'Deadlift (Top Set)'),entry('dlb','dl',2,3,81,'Deadlift (Back-off)')]}],
4:[{title:'DAY 1',sub:'DELOAD',rows:[entry('sqv','sq',2,5,60),entry('bpv','bp',2,5,60)]},{title:'DAY 2',sub:'TECHNIQUE',rows:[entry('dlv','dl',2,5,60),entry('bpl','bp',2,5,60,'Bench Press (Optional)')]},{title:'DAY 3',sub:'DELOAD',rows:[entry('sqt','sq',2,5,65),entry('bpt','bp',2,5,65)]},{title:'DAY 4',sub:'DELOAD',rows:[entry('dlt','dl',2,5,65)]}]};
const titles={1:'W1',2:'W2',3:'W3',4:'W4 / DELOAD'};
const summaries={1:'',2:'',3:'',4:''};
const round25=n=>Math.round(n/2.5)*2.5;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function rowKey(week,day,r){return `${week}-${day}-${r.id}`}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(){const w=state.week;document.querySelectorAll('.tab').forEach(t=>{const on=Number(t.dataset.week)===w;t.classList.toggle('on',on);t.setAttribute('aria-selected',String(on))});document.getElementById('weekTitle').textContent=titles[w];document.getElementById('days').innerHTML=program[w].map((d,di)=>`<article class="day"><header class="day-head"><b>${d.title}</b><small>${d.sub}</small></header><div class="entries">${d.rows.map(r=>{const k=rowKey(w,di,r),weight=state.weights[k]??round25(state.max[r.lift]*r.pct/100);return `<div class="entry"><div class="entry-top"><div><div class="exercise">${esc(r.name)}</div><div class="hint">${r.sets} × ${r.reps} reps &nbsp;@ ${r.pct}%</div></div><div class="weight-wrap"><input aria-label="${esc(r.name)} weight" type="number" min="0" max="400" step="2.5" inputmode="decimal" value="${weight}" data-weight="${k}"><span>kg</span></div></div><div class="sets">${Array.from({length:r.sets},(_,i)=>{const key=k+'-set'+(i+1);return `<label class="set"><input type="checkbox" data-done="${key}" ${state.done[key]?'checked':''}>${i+1} set <span>${r.reps} reps</span></label>`}).join('')}</div></div>`}).join('')}</div><label class="notes-label" for="note-${w}-${di}">NOTES</label><textarea class="notes" id="note-${w}-${di}" data-note="${w}-${di}" placeholder="RIR, technique, adjustments...">${esc(state.notes[`${w}-${di}`]||'')}</textarea></article>`).join('');progress()}
function progress(){let total=0,done=0;for(let di=0;di<program[state.week].length;di++){for(const r of program[state.week][di].rows){total+=r.sets;const k=rowKey(state.week,di,r);for(let i=1;i<=r.sets;i++)if(state.done[k+'-set'+i])done++}}document.getElementById('progress').textContent=`${done} / ${total} sets`}
for(const name of ['sq','bp','dl']){let el=document.getElementById(name);el.value=state.max[name];el.addEventListener('change',()=>{let val=Number(el.value);if(!Number.isFinite(val)||val<=0){el.value=state.max[name];return}state.max[name]=val;Object.keys(state.weights).forEach(k=>{const match=Object.values(program).flat().flatMap(d=>d.rows).find(r=>k.endsWith('-'+r.id)&&r.lift===name);if(match)delete state.weights[k]});save();show()})}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{state.week=Number(t.dataset.week);save();show()}));
document.getElementById('days').addEventListener('change',e=>{const t=e.target;if(t.matches('[data-weight]')){const val=Number(t.value);if(Number.isFinite(val)&&val>=0)state.weights[t.dataset.weight]=val;save()}if(t.matches('[data-done]')){state.done[t.dataset.done]=t.checked;save();progress()}if(t.matches('[data-note]')){state.notes[t.dataset.note]=t.value;save()}});
document.getElementById('days').addEventListener('input',e=>{if(e.target.matches('[data-note]')){state.notes[e.target.dataset.note]=e.target.value;save()}});
document.getElementById('print').addEventListener('click',()=>window.print());
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Reset all completed-set checks? Weights and notes will be kept.')){state.done={};save();show()}});
document.getElementById('csv').addEventListener('click',()=>{const lines=[['Week','Day','Exercise','Sets','Reps','1RM (%)','Weight (kg)','Completed Sets','Notes']];for(let w=1;w<=4;w++)for(let di=0;di<program[w].length;di++){const d=program[w][di];for(const r of d.rows){const k=rowKey(w,di,r);let done=0;for(let i=1;i<=r.sets;i++)if(state.done[k+'-set'+i])done++;lines.push([w,d.title,r.name,r.sets,r.reps,r.pct,state.weights[k]??round25(state.max[r.lift]*r.pct/100),done,state.notes[`${w}-${di}`]||''])}}const csv='\ufeff'+lines.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='BIG3_PROGRAM_log.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)});
show();
</script></body></html>
